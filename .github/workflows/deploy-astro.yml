name: Deploy Astro Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Passo opzionale e "dormiente": segna nel Google Sheet "Bike Style Mag - News Feed"
  # le notizie appena diventate articoli pubblicati (vedi scripts/update_news_tracker.py
  # e STATUS.md per come attivarlo). Non blocca mai il deploy: gira in parallelo a
  # `deploy` (non ne dipende) e ha `continue-on-error` esplicito.
  update-news-tracker:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Autenticazione senza chiavi JSON (Workload Identity Federation): questa
      # organizzazione Google Cloud blocca la creazione di chiavi service account
      # (policy iam.managed.disableServiceAccountKeyCreation). Se i secret non sono
      # ancora configurati, questo step fallisce silenziosamente grazie a
      # continue-on-error a livello di job — lo step successivo si limita a loggare
      # che l'automazione non è attiva (vedi scripts/update_news_tracker.py).
      - name: Authenticate to Google Cloud
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update News Feed tracker for newly published articles
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD -- 'src/content/articles/*.md' 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            echo "No article files changed in this push — nothing to do."
            exit 0
          fi
          python3 scripts/update_news_tracker.py $CHANGED
